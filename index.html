// ── IMPORT ──────────────────────────────────────────────────────
const Import = {
  importRaidHelper(jsonStr) {
    let data;
    try { data = JSON.parse(jsonStr); } catch(e) { return { success:false, error:'Invalid JSON: '+e.message }; }
    if (Array.isArray(data.slots)) return this._importRaidHelperSlots(data);
    if (Array.isArray(data.signUps)) return this._importRaidHelperSignUps(data);
    return { success:false, error:"No 'slots' or 'signUps' array found in JSON" };
  },

  // Resolve a Raid-Helper slot/signup entry (className + specName) to a class/spec/role.
  // Shared by both export shapes below — they use the same field names per entry.
  _resolveRaidHelperEntry(entry) {
    const specInfo = Config.RaidHelperSpecMap[entry.specName];
    let classFile = null, specName = entry.specName || 'Unknown', role = 'melee_dps';

    if (specInfo) {
      classFile = specInfo.class;
      specName = specInfo.spec;
      role = specInfo.role;
    } else {
      classFile = Config.RaidHelperClassMap[entry.className] || null;
    }

    if (entry.className === 'Tank') {
      role = 'tank';
      if (specInfo) classFile = specInfo.class;
    }
    if (entry.className === 'Bench' && specInfo) {
      classFile = specInfo.class;
    }

    return { classFile, specName, role };
  },

  // Format 1: a "slots" export that already carries per-player groupNumber
  // (e.g. an exported raid composition).
  _importRaidHelperSlots(data) {
    let maxGroup = 0;
    for (const slot of data.slots) {
      if (slot.groupNumber && slot.groupNumber > maxGroup) maxGroup = slot.groupNumber;
    }
    if (maxGroup === 0) return { success:false, error:'No groups found in data' };

    const roster = [];
    const groups = [];
    for (let i = 0; i < maxGroup; i++) groups.push([]);

    for (const slot of data.slots) {
      const { classFile, specName, role } = this._resolveRaidHelperEntry(slot);
      if (classFile) {
        const player = {
          uid: nextUid(),
          name: slot.name || ('Unknown-' + (slot.slotNumber || 0)),
          class: classFile,
          spec: specName,
          role: role,
          groupNumber: slot.groupNumber,
          imported: true,
        };
        roster.push(player);
        const g = slot.groupNumber;
        if (g >= 1 && g <= maxGroup) groups[g-1].push(player);
      }
    }

    // Auto-detect raid
    if (roster.length <= 10) {
      for (const key of Config.RaidOrder) {
        if (Config.Raids[key].size === 10) { State.selectedRaid = key; break; }
      }
    }

    State.roster = roster;
    State.groups = groups;
    return { success:true, playerCount:roster.length, groupCount:maxGroup };
  },

  // Format 2: the raid-helper.dev/api/raidplan/{id} "signUps" export — the
  // event sign-up roster, with no group placement at all (players haven't
  // been put into parties yet). Seed groups round-robin, then hand off to
  // the Optimizer to place everyone properly.
  _importRaidHelperSignUps(data) {
    const roster = [];
    for (const signUp of data.signUps) {
      const { classFile, specName, role } = this._resolveRaidHelperEntry(signUp);
      if (classFile) {
        roster.push({
          uid: nextUid(),
          name: signUp.name || ('Unknown-' + (signUp.id || roster.length)),
          class: classFile,
          spec: specName,
          role: role,
          imported: true,
        });
      }
    }
    if (roster.length === 0) return { success:false, error:'No valid players found in sign-ups' };

    // Auto-detect raid
    if (roster.length <= 10) {
      for (const key of Config.RaidOrder) {
        if (Config.Raids[key].size === 10) { State.selectedRaid = key; break; }
      }
    }

    const raidInfo = Config.Raids[State.selectedRaid];
    const numGroups = raidInfo ? raidInfo.groups : 5;
    const groups = [];
    for (let i = 0; i < numGroups; i++) groups.push([]);
    roster.forEach((p, i) => {
      const gi = i % numGroups;
      p.groupNumber = gi + 1;
      groups[gi].push(p);
    });

    State.roster = roster;
    State.groups = groups;
    Optimizer.optimize();

    return { success:true, playerCount:roster.length, groupCount:numGroups, wasUnassigned:true };
  },

  // Compact addon-friendly export string
  // Format: PP:1:raid:G1name.class.spec.role,name.class.spec.role:G2...:G3...
  // Class/spec/role use short codes to keep the string small.
  classCode: {
    WARRIOR:'WR', PALADIN:'PA', HUNTER:'HU', ROGUE:'RO',
    PRIEST:'PR', SHAMAN:'SH', MAGE:'MA', WARLOCK:'WL', DRUID:'DR',
  },
  specCode: {
    Protection:'Prot', Retribution:'Ret', Holy:'Holy',
    Arms:'Arms', Fury:'Fury',
    'Beast Mastery':'BM', Marksmanship:'MM', Survival:'SV',
    Combat:'Com', Assassination:'Ass', Subtlety:'Sub',
    Shadow:'Shad', Discipline:'Disc',
    Enhancement:'Enh', Elemental:'Ele', Restoration:'Rest',
    Arcane:'Arc', Fire:'Fire', Frost:'Fro',
    Destruction:'Dest', Affliction:'Aff', Demonology:'Demo',
    Balance:'Bal', Feral:'Fer',
  },
  roleCode: { tank:'T', healer:'H', melee_dps:'M', ranged_dps:'R', caster_dps:'C' },

  exportAddonString() {
    const cc = this.classCode;
    const sc = this.specCode;
    const rc = this.roleCode;
    const parts = ['PP', '1', State.selectedRaid];
    for (const g of State.groups) {
      const players = g.map(p => {
        const c = cc[p.class] || p.class;
        const s = sc[p.spec] || p.spec;
        const r = rc[p.role] || p.role;
        return `${p.name}.${c}.${s}.${r}`;
      });
      parts.push(players.join(','));
    }
    return parts.join(':');
  },

  importAddonString(str) {
    // Reverse lookup maps
    const ccRev = {}; for (const [k,v] of Object.entries(this.classCode)) ccRev[v] = k;
    const scRev = {}; for (const [k,v] of Object.entries(this.specCode)) scRev[v] = k;
    const rcRev = {}; for (const [k,v] of Object.entries(this.roleCode)) rcRev[v] = k;

    const parts = str.split(':');
    if (parts[0] !== 'PP') return { success:false, error:'Not a Party Planner export string' };
    const version = parts[1];
    if (version !== '1') return { success:false, error:'Unknown export version: ' + version };
    const raid = parts[2];
    if (!Config.Raids[raid]) return { success:false, error:'Unknown raid: ' + raid };

    State.selectedRaid = raid;
    const raidInfo = Config.Raids[raid];
    const numGroups = raidInfo.groups;
    const roster = [];
    const groups = [];
    for (let i = 0; i < numGroups; i++) groups.push([]);

    for (let gi = 0; gi < numGroups && (gi + 3) < parts.length; gi++) {
      const groupStr = parts[gi + 3];
      if (!groupStr) continue;
      const playerStrs = groupStr.split(',');
      for (const ps of playerStrs) {
        const [name, cCode, sCode, rCode] = ps.split('.');
        if (!name) continue;
        const player = {
          uid: nextUid(),
          name,
          class: ccRev[cCode] || cCode,
          spec: scRev[sCode] || sCode,
          role: rcRev[rCode] || rCode,
          groupNumber: gi + 1,
          imported: true,
        };
        roster.push(player);
        groups[gi].push(player);
      }
    }

    State.roster = roster;
    State.groups = groups;
    return { success:true, playerCount:roster.length, groupCount:numGroups };
  },

  exportRoster(name) {
    return {
      name: name || State.rosterName || 'Unnamed',
      raid: State.selectedRaid,
      timestamp: Date.now(),
      players: State.roster.map(p => ({
        name:p.name, class:p.class, spec:p.spec, role:p.role, groupNumber:p.groupNumber,
      })),
    };
  },

  loadRoster(data) {
    if (!data || !data.players) return false;
    if (data.raid) State.selectedRaid = data.raid;

    const raidInfo = Config.Raids[State.selectedRaid];
    const numGroups = raidInfo ? raidInfo.groups : 5;

    const roster = [];
    const groups = [];
    for (let i = 0; i < numGroups; i++) groups.push([]);

    for (const p of data.players) {
      const player = { uid: p.uid || nextUid(), name:p.name, class:p.class, spec:p.spec, role:p.role, groupNumber:p.groupNumber, imported:true };
      roster.push(player);
      const g = player.groupNumber;
      if (g >= 1 && g <= numGroups) groups[g-1].push(player);
    }
    State.roster = roster;
    State.groups = groups;
    State.rosterName = data.name || 'Loaded Roster';
    return true;
  },
};

// ── RANDOM ROSTER GENERATOR ──────────────────────────────────────

const RandomRoster = {
  // Specs grouped by role for quick lookup
  _specsByRole: null,

  _buildSpecsByRole() {
    if (this._specsByRole) return this._specsByRole;
    const byRole = { tank: [], healer: [], melee_dps: [], ranged_dps: [], caster_dps: [] };
    for (const [cls, specs] of Object.entries(Config.Specs)) {
      for (const [, spec] of Object.entries(specs)) {
        byRole[spec.role].push({ class: cls, spec: spec.name, role: spec.role });
      }
    }
    this._specsByRole = byRole;
    return byRole;
  },

  _pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },

  _shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  },

  _randomName(usedNames) {
    const syllables = ['Tha','Mor','Kel','Zar','Gor','Ven','Ash','Dra','Lor','Fen',
      'Bri','Nox','Syl','Kor','Tal','Myr','Vor','Gal','Ren','Ula','Kae','Ori','Zan',
      'Thi','Nym','Eld','Rho','Isa','Val','Hel','Sar','Mal','Dun','Tor','Ari','Fyn'];
    for (let attempt = 0; attempt < 100; attempt++) {
      const len = 2 + Math.floor(Math.random() * 2); // 2-3 syllables
      let name = '';
      for (let i = 0; i < len; i++) name += (i === 0 ? this._pick(syllables) : this._pick(syllables).toLowerCase());
      if (!usedNames.has(name)) { usedNames.add(name); return name; }
    }
    return 'Player' + Math.floor(Math.random() * 9999);
  },

  generate() {
    const raidInfo = Config.Raids[State.selectedRaid];
    const size = raidInfo ? raidInfo.size : 25;
    const numGroups = raidInfo ? raidInfo.groups : 5;

    const tanks = (size === 10) ? 2 : 2;
    const healers = (size === 10) ? 2 : 5;
    const dps = size - tanks - healers;

    const byRole = this._buildSpecsByRole();
    const roster = [];
    const usedNames = new Set();

    const makePlayer = (specInfo) => ({
      uid: nextUid(),
      name: this._randomName(usedNames),
      class: specInfo.class,
      spec: specInfo.spec,
      role: specInfo.role,
      groupNumber: 0,
      imported: true,
    });

    // Tanks
    for (let i = 0; i < tanks; i++) roster.push(makePlayer(this._pick(byRole.tank)));

    // Healers
    for (let i = 0; i < healers; i++) roster.push(makePlayer(this._pick(byRole.healer)));

    // DPS — split roughly half melee, half ranged/caster
    const meleeCount = Math.floor(dps / 2);
    const rangedCount = dps - meleeCount;
    for (let i = 0; i < meleeCount; i++) roster.push(makePlayer(this._pick(byRole.melee_dps)));
    for (let i = 0; i < rangedCount; i++) {
      // Mix ranged_dps and caster_dps
      const pool = [...byRole.ranged_dps, ...byRole.caster_dps];
      roster.push(makePlayer(this._pick(pool)));
    }

    // Shuffle and distribute into groups
    this._shuffle(roster);
    const groups = [];
    for (let i = 0; i < numGroups; i++) groups.push([]);
    for (let i = 0; i < roster.length; i++) {
      const gi = i % numGroups;
      roster[i].groupNumber = gi + 1;
      groups[gi].push(roster[i]);
    }

    State.roster = roster;
    State.groups = groups;
    State.rosterName = 'Random ' + size + '-man Roster';
    State.buffOverrides = {};
  },
};

// ── OPTIMIZER ────────────────────────────────────────────────────
// Received-value scorer: the objective is what each group member RECEIVES
// from the party buffs present in their group (per-spec DPS weights, and
// per-tank-class mitigation weights for the tank group), plus structural
// terms (healer coverage, role cohesion, spreading pressure). All phases
// (greedy placement, swap refinement, de-isolation) share one groupScore().

// Mode weights over the objective components:
//   dps       — party-buff DPS value received by members (DPS_VALUE)
//   mit       — mitigation value of buffs reaching tanks in the tank group (MIT_VALUE)
//   structure — healer coverage + spreading pressure
//   cohesion  — role-family clustering around each group's identity
const MODE_CONFIG = {
  max_dps:  { dps: 1.0, mit: 0.25, structure: 0.7, cohesion: 0.4 },
  tank_mit: { dps: 0.7, mit: 1.2,  structure: 1.0, cohesion: 0.4 },
  balanced: { dps: 0.7, mit: 0.5,  structure: 1.0, cohesion: 1.0 },
  relaxed:  { dps: 0.2, mit: 0.3,  structure: 1.0, cohesion: 1.5 },
};

// ── SYNERGY MODEL (researched TBC party-buff values) ──
// DPS_VALUE[buffId] — estimated % DPS gain for a RECEIVING player, resolved
// key ('CLASS:Spec') → class → role → 0. Sources: Wowhead TBC spell data,
// Warcraft Tavern totem/class guides, Icy Veins raid composition guide.
// Notable modeling choices:
//  - Windfury: Ret > Fury > Arms > Rogues (main-hand only). Feral druids get
//    NOTHING from WF (weapon imbues don't work in forms) — hence the 0 key.
//    Hunters don't benefit either (melee-weapon imbue; role table omits ranged).
//  - Ferocious Inspiration is 3% damage for the whole party, any role.
//  - Vampiric Touch is a party mana battery: locks/arcane mages value it most.
const DPS_VALUE = {
  WINDFURY:           { key: { 'PALADIN:Retribution': 12, 'WARRIOR:Fury': 11, 'WARRIOR:Arms': 10, 'SHAMAN:Enhancement': 9, 'ROGUE:Combat': 8, 'ROGUE:Assassination': 8, 'ROGUE:Subtlety': 8, 'DRUID:Feral': 0 }, role: { melee_dps: 8, tank: 3 } },
  GRACE_OF_AIR:       { key: { 'DRUID:Feral': 4 }, role: { melee_dps: 2, ranged_dps: 3, tank: 2 } },
  WRATH_OF_AIR:       { role: { caster_dps: 4, healer: 2 } },
  TOTEM_OF_WRATH:     { role: { caster_dps: 6, healer: 1 } },
  STRENGTH_OF_EARTH:  { role: { melee_dps: 2, tank: 2 } },
  MANA_SPRING:        { role: { healer: 2, caster_dps: 1 } },
  MANA_TIDE:          { role: { healer: 4 } },
  DEVOTION_AURA:      { role: {} },
  CONCENTRATION_AURA: { role: { healer: 2, caster_dps: 1 } },
  RETRIBUTION_AURA:   { role: { melee_dps: 1, tank: 1 } },
  LEADER_OF_THE_PACK: { role: { melee_dps: 5, ranged_dps: 5, tank: 2 } },
  MOONKIN_AURA:       { role: { caster_dps: 5 } },
  TREE_OF_LIFE:       { role: { healer: 1 } },
  TRUESHOT_AURA:      { role: { melee_dps: 3, ranged_dps: 4 } },
  FEROCIOUS_INSP:     { role: { melee_dps: 3, ranged_dps: 3, caster_dps: 3, tank: 1 } },
  UNLEASHED_RAGE:     { role: { melee_dps: 5, ranged_dps: 4, tank: 2 } },
  BATTLE_SHOUT:       { role: { melee_dps: 3, ranged_dps: 2, tank: 2 } },
  BLOOD_PACT:         { role: { tank: 1 } },
  VAMPIRIC_TOUCH:     { key: { 'MAGE:Arcane': 7 }, class: { WARLOCK: 6, MAGE: 6 }, role: { caster_dps: 4, healer: 3 } },
};

// MIT_VALUE[buffId] — survivability value for a TANK receiving the buff,
// keyed per tank class:spec ('*' = any tank). Researched priorities:
//  - Prot Warrior: armor (Devotion, ~5-7% phys DR) + block value (SoE)
//  - Prot Paladin: armor + dodge (Grace of Air — primary avoidance)
//  - Feral Druid: agility scaling (GoA) + Imp LotP heal; low Devotion value
//    (high base armor), zero Windfury (no weapon imbues in forms)
//  - Tree of Life (+25% healing received, party-only) is huge for any tank
const MIT_VALUE = {
  DEVOTION_AURA:      { 'WARRIOR:Protection': 10, 'PALADIN:Protection': 10, 'DRUID:Feral': 5 },
  GRACE_OF_AIR:       { 'WARRIOR:Protection': 4, 'PALADIN:Protection': 7, 'DRUID:Feral': 9 },
  BLOOD_PACT:         { '*': 6 },
  TREE_OF_LIFE:       { '*': 12 },
  STRENGTH_OF_EARTH:  { 'WARRIOR:Protection': 5, 'PALADIN:Protection': 2, 'DRUID:Feral': 3 },
  LEADER_OF_THE_PACK: { 'DRUID:Feral': 6, '*': 2 },
  WINDFURY:           { 'WARRIOR:Protection': 4, 'PALADIN:Protection': 1, 'DRUID:Feral': 0 },
  BATTLE_SHOUT:       { '*': 2 },
  RETRIBUTION_AURA:   { '*': 1 },
};

// Healer-sustain buffs: extra value in the tank group per healer present
// (capped at 2) — Mana Tide/Spring keep tank healers casting, VT feeds
// their mana, Concentration Aura protects their casts.
const SUSTAIN_VALUE = { MANA_SPRING: 3, MANA_TIDE: 5, VAMPIRIC_TOUCH: 3, CONCENTRATION_AURA: 3 };

function dpsValueFor(buffId, player) {
  const v = DPS_VALUE[buffId];
  if (!v) return 0;
  const key = player.class + ':' + player.spec;
  if (v.key && v.key[key] != null) return v.key[key];
  if (v.class && v.class[player.class] != null) return v.class[player.class];
  if (v.role && v.role[player.role] != null) return v.role[player.role];
  return 0;
}

function mitValueFor(buffId, tank) {
  const v = MIT_VALUE[buffId];
  if (!v) return 0;
  const key = tank.class + ':' + tank.spec;
  if (v[key] != null) return v[key];
  if (v['*'] != null) return v['*'];
  return 0;
}

const ROLE_COMPAT = {
  tank:       ['melee_dps', 'healer'],
  healer:     ['tank', 'caster_dps'],
  melee_dps:  ['tank', 'ranged_dps'],
  ranged_dps: ['melee_dps', 'caster_dps'],
  caster_dps: ['healer', 'ranged_dps'],
};

const Optimizer = {
  optimize() {
    const raidInfo = Config.Raids[State.selectedRaid];
    const numGroups = raidInfo ? raidInfo.groups : 5;
    const raidSize = raidInfo ? raidInfo.size : 25;
    const max = 5;
    const mode = State.optimizerMode || 'max_dps';

    const pool = [];
    for (const group of State.groups) {
      for (const player of group) pool.push(player);
    }
    if (pool.length === 0) return;

    const groups = [];
    for (let i = 0; i < numGroups; i++) groups.push([]);

    // Phase 1: Seed groups with role identities
    this.seedGroups(pool, groups, numGroups, raidSize, max, mode);

    // Phase 2: Greedy marginal-gain placement of remaining players
    this.greedyPlace(pool, groups, max, mode);

    // Phase 3: Swap refinement (skip for relaxed)
    if (mode !== 'relaxed') {
      this.refineSwaps(groups, max, mode);
    }

    // Phase 4: De-isolation — always runs, every mode. A player who benefits
    // from nobody in their group (e.g. the lone melee DPS in an otherwise
    // all-caster/healer group) is worse than a small buff-score inefficiency,
    // but refineSwaps only takes a swap that clears SWAP_THRESHOLD, so an
    // isolated player can survive it if no single swap scores well enough.
    this.deIsolate(groups);

    for (let gi = 0; gi < groups.length; gi++) {
      for (const p of groups[gi]) p.groupNumber = gi + 1;
    }
    State.groups = groups;
    State.roster = groups.flat();
  },

  // ── PHASE 1: SEED GROUPS ─────────────────────────────────────
  seedGroups(pool, groups, numGroups, raidSize, max, mode) {
    if (numGroups >= 5) {
      groups._roleIdentities = ['melee_dps', 'melee_dps', 'caster_dps', 'caster_dps', 'tank'];
    } else {
      groups._roleIdentities = ['melee_dps', 'caster_dps'];
    }

    // Seed tanks into the tank-identity group; tank_mit consolidates all of
    // them (up to 3) there so mitigation buffs cover every tank, other modes
    // seed the minimum 2 and let the scorer place extras (OT groups).
    const tankIdx = groups._roleIdentities.indexOf('tank');
    const targetIdx = tankIdx >= 0 ? tankIdx : 0;
    const minTanks = mode === 'tank_mit' ? 3 : 2;
    let seeded = 0;
    for (let i = pool.length - 1; i >= 0; i--) {
      if (seeded >= minTanks) break;
      if (pool[i].role === 'tank' && groups[targetIdx].length < max) {
        groups[targetIdx].push(pool.splice(i, 1)[0]);
        seeded++;
      }
    }

    // Seed one healer into EVERY group up front (tank group included — it
    // always needs healing support). There is no 'healer' role identity, so
    // without this, healers were left entirely to buff-value scoring — which
    // let them pile into one group and starve the others of healing.
    // groupScore()'s healer-coverage term keeps later phases from undoing it.
    for (let gi = 0; gi < numGroups; gi++) {
      if (groups[gi].length >= max) continue;
      const healerIdx = pool.findIndex(p => p.role === 'healer');
      if (healerIdx === -1) break;
      groups[gi].push(pool.splice(healerIdx, 1)[0]);
    }
  },

  // ── PHASE 2: GREEDY MARGINAL-GAIN PLACEMENT ──────────────────
  // Each step places the (player, group) pair with the highest marginal
  // groupScore gain. Because groupScore measures what members RECEIVE, this
  // both attracts buffers to groups that want their buffs and attracts
  // beneficiaries to groups that already have the buffs.
  greedyPlace(pool, groups, max, mode) {
    while (pool.length > 0) {
      let bestGain = -Infinity;
      let bestPlayerIdx = -1;
      let bestGroupIdx = -1;

      for (let gi = 0; gi < groups.length; gi++) {
        if (groups[gi].length >= max) continue;
        const base = this.groupScore(groups[gi], gi, groups, mode);
        for (let pi = 0; pi < pool.length; pi++) {
          groups[gi].push(pool[pi]);
          const gain = this.groupScore(groups[gi], gi, groups, mode) - base;
          groups[gi].pop();
          if (gain > bestGain) {
            bestGain = gain;
            bestPlayerIdx = pi;
            bestGroupIdx = gi;
          }
        }
      }

      // No group has space — stop placing
      if (bestGroupIdx < 0) break;

      groups[bestGroupIdx].push(pool.splice(bestPlayerIdx, 1)[0]);
    }
  },

  // ── SCORING ──────────────────────────────────────────────────
  isTankGroup(gi, groups) {
    const ids = groups._roleIdentities;
    if (!ids) return gi === 0;
    const t = ids.indexOf('tank');
    return t >= 0 ? gi === t : gi === 0;
  },

  // Buffs the group actually gets: passives deduped, one totem per element
  // per shaman (chosen by group value — models totem assignments/twisting),
  // one distinct aura per paladin (best available by group value).
  resolveGroupBuffs(group, valueFn) {
    const chosen = new Set();
    const usedAuras = new Set();
    for (const p of group) {
      if (p.class === 'SHAMAN') {
        const byElement = {};
        for (const [id, buff] of Object.entries(Config.Buffs)) {
          if (buff.sourceClass !== 'SHAMAN') continue;
          if (buff.sourceSpec && buff.sourceSpec !== p.spec) continue;
          const el = TOTEM_ELEMENTS[id];
          if (el) (byElement[el] = byElement[el] || []).push(id);
          else chosen.add(id); // shaman passives (e.g. Unleashed Rage)
        }
        for (const el of Object.keys(byElement)) {
          let best = null, bestV = 0;
          for (const id of byElement[el]) {
            if (chosen.has(id)) continue; // another shaman already provides it
            const v = valueFn(id);
            if (v > bestV) { bestV = v; best = id; }
          }
          if (best) chosen.add(best);
        }
      } else if (p.class === 'PALADIN') {
        let best = null, bestV = -1;
        for (const id of Object.keys(PALADIN_AURAS)) {
          if (usedAuras.has(id)) continue;
          const v = valueFn(id);
          if (v > bestV) { bestV = v; best = id; }
        }
        if (best) { usedAuras.add(best); chosen.add(best); }
      } else {
        for (const [id, buff] of Object.entries(Config.Buffs)) {
          if (buff.sourceClass !== p.class) continue;
          if (buff.sourceSpec && buff.sourceSpec !== p.spec) continue;
          if (TOTEM_ELEMENTS[id] || PALADIN_AURAS[id]) continue;
          chosen.add(id);
        }
      }
    }
    return chosen;
  },

  // The single objective all phases share. Higher = better group.
  groupScore(group, gi, groups, mode) {
    const cfg = MODE_CONFIG[mode] || MODE_CONFIG.max_dps;
    const roleIdentity = (groups._roleIdentities && groups._roleIdentities[gi]) || 'melee_dps';
    const isTank = this.isTankGroup(gi, groups);
    const healerCount = group.reduce((n, p) => n + (p.role === 'healer' ? 1 : 0), 0);
    const tanks = group.filter(p => p.role === 'tank');

    // Value of one buff to this group = summed received DPS value, plus
    // mitigation + healer-sustain value when it reaches the tank group.
    const buffValue = (id) => {
      let v = 0;
      for (const m of group) v += dpsValueFor(id, m) * cfg.dps;
      if (isTank) {
        for (const t of tanks) v += mitValueFor(id, t) * cfg.mit;
        if (SUSTAIN_VALUE[id]) v += SUSTAIN_VALUE[id] * Math.min(healerCount, 2) * cfg.mit;
      }
      return v;
    };

    let score = 0;
    for (const id of this.resolveGroupBuffs(group, buffValue)) score += buffValue(id);

    // Ferocious Inspiration stacks multiplicatively per BM Hunter (1.03^n) —
    // the only party buff that does. resolveGroupBuffs dedupes it like any
    // passive, so credit each additional BM hunter's copy here.
    const bmCount = group.reduce((n, p) => n + (p.class === 'HUNTER' && p.spec === 'Beast Mastery' ? 1 : 0), 0);
    if (bmCount > 1) score += (bmCount - 1) * buffValue('FEROCIOUS_INSP');

    // Healer coverage — strong first-healer bonus so refinement phases never
    // strip a group's only healer; the tank group in tank_mit mode also
    // values a second and third healer highly.
    const healerBonus = (isTank && mode === 'tank_mit')
      ? [0, 50, 80, 92, 96]
      : [0, 50, 62, 64, 64];
    score += healerBonus[Math.min(healerCount, 4)] * cfg.structure;

    // Role cohesion — DPS members clustered with their group's identity.
    // Healers and tanks are governed by coverage/seeding, not cohesion.
    for (const p of group) {
      if (p.role === 'healer' || p.role === 'tank') continue;
      if (p.role === roleIdentity) score += 12 * cfg.cohesion;
      else if (ROLE_COMPAT[p.role] && ROLE_COMPAT[p.role].includes(roleIdentity)) score += 6 * cfg.cohesion;
      else score -= 12 * cfg.cohesion;
    }

    // Spreading pressure — convex penalty so the marginal cost of joining a
    // fuller group is higher, nudging placement toward emptier groups when
    // synergy gains are comparable.
    score -= 0.8 * group.length * group.length * cfg.structure;

    return score;
  },

  // ── PHASE 3: SWAP REFINEMENT ─────────────────────────────────
  // Hill-climbs pairwise swaps against the same groupScore() objective the
  // greedy phase used, so refinement can never "improve" toward a different
  // goal than placement optimized for.
  refineSwaps(groups, max, mode) {
    const SWAP_THRESHOLD = 3;
    for (let iter = 0; iter < 4; iter++) {
      let improved = false;
      for (let gi = 0; gi < groups.length; gi++) {
        for (let gj = gi + 1; gj < groups.length; gj++) {
          for (let pi = 0; pi < groups[gi].length; pi++) {
            // Never swap seeded tanks out of the tank-identity group
            if (groups[gi][pi].role === 'tank' && this.isTankGroup(gi, groups)) continue;
            for (let pj = 0; pj < groups[gj].length; pj++) {
              if (groups[gj][pj].role === 'tank' && this.isTankGroup(gj, groups)) continue;
              const currentScore = this.groupScore(groups[gi], gi, groups, mode)
                                 + this.groupScore(groups[gj], gj, groups, mode);

              // Tentatively swap
              const tmp = groups[gi][pi];
              groups[gi][pi] = groups[gj][pj];
              groups[gj][pj] = tmp;

              const newScore = this.groupScore(groups[gi], gi, groups, mode)
                             + this.groupScore(groups[gj], gj, groups, mode);

              if (newScore > currentScore + SWAP_THRESHOLD) {
                improved = true;
              } else {
                // Revert swap
                groups[gj][pj] = groups[gi][pi];
                groups[gi][pi] = tmp;
              }
            }
          }
        }
      }
      if (!improved) break;
    }
  },

  // ── PHASE 4: DE-ISOLATION ─────────────────────────────────────
  // Finds any melee_dps/caster_dps player with zero role-compatible peers in
  // their own group and swaps them for an opposite-family player elsewhere —
  // preferring a partner who is themselves mismatched (a caster stuck in a
  // melee-heavy group, etc.), since that swap fixes both sides at once.
  deIsolate(groups) {
    const family = role =>
      (role === 'melee_dps' || role === 'tank') ? 'melee' :
      (role === 'caster_dps' || role === 'healer' || role === 'ranged_dps') ? 'caster' :
      null;

    // A single pass can fix one isolated player by pulling their swap
    // partner out of ITS group — which can leave a different player newly
    // isolated (or not notice one uncovered earlier in the same pass, since
    // groups already scanned aren't revisited). Iterate to a fixed point,
    // same as refineSwaps, capped so a pathological roster can't loop forever.
    for (let iter = 0; iter < 6; iter++) {
      let swapped = false;

      for (let gi = 0; gi < groups.length; gi++) {
        for (let pi = 0; pi < groups[gi].length; pi++) {
          const p = groups[gi][pi];
          if (p.role !== 'melee_dps' && p.role !== 'caster_dps') continue;
          const pFam = family(p.role);
          const hasPeer = groups[gi].some((x, xi) => xi !== pi && family(x.role) === pFam);
          if (hasPeer) continue;

          let bestGj = -1, bestPj = -1, bestScore = -Infinity;
          for (let gj = 0; gj < groups.length; gj++) {
            if (gj === gi) continue;
            for (let pj = 0; pj < groups[gj].length; pj++) {
              const q = groups[gj][pj];

              // Invariants outrank fixing DPS isolation: never pull a tank
              // out of the tank-identity group, and never strip a group of
              // its only healer.
              if (q.role === 'tank' && this.isTankGroup(gj, groups)) continue;
              if (q.role === 'healer' && groups[gj].reduce((n, x) => n + (x.role === 'healer' ? 1 : 0), 0) <= 1) continue;

              // p only needs gj to already have OTHER pFam members before q
              // leaves — q's own family is irrelevant to whether this fixes
              // p. (A same-family q works too: pulling one melee out of a
              // group that has three, to rescue an isolated melee elsewhere,
              // is exactly as valid as trading with an opposite-family q.)
              const gjWithoutQ = groups[gj].filter((x, xj) => xj !== pj);
              const pHasPeerAfter = gjWithoutQ.some(x => family(x.role) === pFam);
              if (!pHasPeerAfter) continue; // must actually resolve p's isolation

              // Prefer swaps that don't just relocate the isolation onto q.
              // Check q's family against gi's OTHER members only (excluding
              // p, who is leaving) — q trivially "matches itself", so q must
              // never be included in the set it's being checked against.
              const qFam = family(q.role);
              let qOk = true;
              if (q.role === 'melee_dps' || q.role === 'caster_dps') {
                const giWithoutP = groups[gi].filter((x, xi) => xi !== pi);
                qOk = giWithoutP.some(x => family(x.role) === qFam);
              }

              const score = qOk ? 2 : 1;
              if (score > bestScore) { bestScore = score; bestGj = gj; bestPj = pj; }
            }
          }

          if (bestGj >= 0) {
            const tmp = groups[gi][pi];
            groups[gi][pi] = groups[bestGj][bestPj];
            groups[bestGj][bestPj] = tmp;
            swapped = true;
          }
        }
      }

      if (!swapped) break;
    }
  },
};

// ── BUFF CALCULATOR (from Optimizer.lua GetGroupBuffs) ──────────
function getGroupBuffs(players, groupIndex) {
  const buffList = [];
  const passiveAdded = new Set(); // prevent duplicate passive buffs
  const usedAuras = new Set(); // prevent duplicate paladin auras in auto-assign

  // Determine dominant role
  const roleCounts = {};
  for (const p of players) roleCounts[p.role] = (roleCounts[p.role] || 0) + 1;
  let dominantRole = 'melee_dps', maxCount = 0;
  for (const [role, count] of Object.entries(roleCounts)) {
    if (count > maxCount) { maxCount = count; dominantRole = role; }
  }

  for (const player of players) {
    if (player.class === 'SHAMAN') {
      // Each shaman provides one totem per element
      const shamanTotems = {}; // element → { buffId, isOverride }

      // Check for overrides first
      if (groupIndex !== undefined) {
        for (const element of ['air', 'fire', 'water', 'earth']) {
          const key = `${groupIndex}:${player.uid}:${element}`;
          const ov = State.buffOverrides[key];
          if (ov && Config.Buffs[ov.buffId]) {
            shamanTotems[element] = { buffId: ov.buffId, isOverride: true };
          }
        }
      }

      // Auto-select remaining elements
      for (const [buffId, buff] of Object.entries(Config.Buffs)) {
        if (buff.sourceClass !== 'SHAMAN') continue;
        if (buff.sourceSpec && buff.sourceSpec !== player.spec) continue;
        const element = TOTEM_ELEMENTS[buffId];
        if (!element) continue;
        if (shamanTotems[element]?.isOverride) continue;

        if (!shamanTotems[element]) {
          shamanTotems[element] = { buffId };
        } else {
          const bestForRole = BEST_AIR_TOTEM[dominantRole];
          if (element === 'air' && buffId === bestForRole) {
            shamanTotems[element] = { buffId };
          } else if (element === 'water' && buffId === 'MANA_TIDE') {
            shamanTotems[element] = { buffId };
          }
        }
      }

      for (const [, entry] of Object.entries(shamanTotems)) {
        const buff = Config.Buffs[entry.buffId];
        if (buff) buffList.push({ id: entry.buffId, buff, sourceUid: player.uid, sourceName: player.name, sourceClass: player.class, sourceSpec: player.spec, isOverride: !!entry.isOverride });
      }

      // Non-totem Shaman passives (e.g. Unleashed Rage) — one per unique buff type
      for (const [buffId, buff] of Object.entries(Config.Buffs)) {
        if (buff.sourceClass !== 'SHAMAN') continue;
        if (TOTEM_ELEMENTS[buffId]) continue;
        if (buff.sourceSpec && buff.sourceSpec !== player.spec) continue;
        if (passiveAdded.has(buffId)) continue;
        passiveAdded.add(buffId);
        buffList.push({ id: buffId, buff, sourceUid: player.uid, sourceName: player.name, sourceClass: player.class, sourceSpec: player.spec, isOverride: false });
      }

    } else if (player.class === 'PALADIN') {
      // Each paladin provides one aura — avoid duplicating auras already assigned
      let auraBuffId, isOverride = false;

      if (groupIndex !== undefined) {
        const key = `${groupIndex}:${player.uid}:aura`;
        const ov = State.buffOverrides[key];
        if (ov && Config.Buffs[ov.buffId]) {
          auraBuffId = ov.buffId;
          isOverride = true;
        }
      }

      if (!auraBuffId) {
        // Pick best available aura not already used by another paladin
        const preferred = BEST_PALADIN_AURA[dominantRole] || 'DEVOTION_AURA';
        if (!usedAuras.has(preferred)) {
          auraBuffId = preferred;
        } else {
          // Pick the highest-priority aura not yet taken
          const allAuras = Object.keys(PALADIN_AURAS)
            .filter(id => !usedAuras.has(id))
            .sort((a, b) => getBuffPriority(Config.Buffs[b], dominantRole) - getBuffPriority(Config.Buffs[a], dominantRole));
          auraBuffId = allAuras[0] || preferred; // fallback if all taken
        }
      }

      usedAuras.add(auraBuffId);
      const buff = Config.Buffs[auraBuffId];
      if (buff) buffList.push({ id: auraBuffId, buff, sourceUid: player.uid, sourceName: player.name, sourceClass: player.class, sourceSpec: player.spec, isOverride });

    } else {
      // Passive buffs — one per unique buff type in the group
      for (const [buffId, buff] of Object.entries(Config.Buffs)) {
        if (player.class !== buff.sourceClass) continue;
        if (buff.sourceSpec && player.spec !== buff.sourceSpec) continue;
        if (TOTEM_ELEMENTS[buffId] || PALADIN_AURAS[buffId]) continue;
        if (passiveAdded.has(buffId)) continue;
        passiveAdded.add(buffId);
        buffList.push({ id: buffId, buff, sourceUid: player.uid, sourceName: player.name, sourceClass: player.class, sourceSpec: player.spec, isOverride: false });
      }
    }
  }

  buffList.sort((a, b) => getBuffPriority(b.buff, dominantRole) - getBuffPriority(a.buff, dominantRole));
  return buffList;
}

// ── UI RENDERING ────────────────────────────────────────────────
function initRaidDropdown() {
  const sel = document.getElementById('raid-select');
  sel.innerHTML = '';
  for (const key of Config.RaidOrder) {
    const r = Config.Raids[key];
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = `${r.name} (${r.size})`;
    if (key === State.selectedRaid) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => {
    State.selectedRaid = sel.value;
    if (State.activeTab === 'ideal') {
      renderIdealComp();
    } else {
      initGroups();
      renderGroups();
    }
  });
}

function initGroups() {
  const raidInfo = Config.Raids[State.selectedRaid];
  const numGroups = raidInfo ? raidInfo.groups : 5;
  while (State.groups.length < numGroups) State.groups.push([]);
  while (State.groups.length > numGroups) {
    const overflow = State.groups.pop();
    for (const p of overflow) {
      for (let i = 0; i < State.groups.length; i++) {
        if (State.groups[i].length < 5) { State.groups[i].push(p); p.groupNumber = i + 1; break; }
      }
    }
  }
}

function getRoleIcon(role) {
  if (role === 'tank') return '<span class="role-icon role-tank">&#9781;</span>';
  if (role === 'healer') return '<span class="role-icon role-healer">&#10010;</span>';
  return '<span class="role-icon role-dps">&#9876;</span>';
}

function getDragHandle() {
  return '<div class="drag-handle"><div class="drag-dot-row"><span class="drag-dot"></span><span class="drag-dot"></span></div><div class="drag-dot-row"><span class="drag-dot"></span><span class="drag-dot"></span></div><div class="drag-dot-row"><span class="drag-dot"></span><span class="drag-dot"></span></div></div>';
}

function getDominantRoleLabel(players) {
  const roleCounts = {};
  for (const p of players) roleCounts[p.role] = (roleCounts[p.role] || 0) + 1;
  let best = '', max = 0;
  for (const [role, count] of Object.entries(roleCounts)) {
    if (count > max) { max = count; best = role; }
  }
  const labels = { tank:'TANK', healer:'HEALER', melee_dps:'MELEE', ranged_dps:'RANGED', caster_dps:'CASTER' };
  return labels[best] || '';
}

function sortTankGroupFirst() {
  if (State.groups.length <= 1) return;
  // Prefer the optimizer's structural identity (authoritative, tie-proof);
  // fall back to dominant-role detection for imported/manual rosters.
  let tankIdx = -1;
  const ids = State.groups._roleIdentities;
  if (ids) tankIdx = ids.indexOf('tank');
  if (tankIdx < 0) {
    for (let i = 0; i < State.groups.length; i++) {
      if (getDominantRoleLabel(State.groups[i] || []) === 'TANK') { tankIdx = i; break; }
    }
  }
  if (tankIdx > 0) {
    // Move tank group to index 0, shift others down
    const tankGroup = State.groups.splice(tankIdx, 1)[0];
    State.groups.unshift(tankGroup);
    // Keep the identity list aligned with the new order (splice() on the
    // array doesn't move the custom _roleIdentities property's entries)
    if (ids) {
      ids.splice(tankIdx, 1);
      ids.unshift('tank');
    }
    // Update groupNumber on all players
    for (let i = 0; i < State.groups.length; i++) {
      for (const p of (State.groups[i] || [])) p.groupNumber = i + 1;
    }
    // Remap any buff overrides that reference the old indices
    const newOverrides = {};
    for (const [key, val] of Object.entries(State.buffOverrides)) {
      const parts = key.split(':');
      let gi = parseInt(parts[0]);
      const rest = parts.slice(1).join(':');
      if (gi === tankIdx) gi = 0;
      else if (gi < tankIdx) gi = gi + 1;
      newOverrides[`${gi}:${rest}`] = val;
    }
    State.buffOverrides = newOverrides;
  }
}

function renderGroups() {
  // Ensure the tank group is always Group 1
  sortTankGroupFirst();

  const container = document.getElementById('groups-container');
  container.innerHTML = '';

  const raidInfo = Config.Raids[State.selectedRaid];
  const numGroups = raidInfo ? raidInfo.groups : 5;

  // Apply grid layout class based on group count
  container.className = 'groups-container';
  if (numGroups === 5) container.classList.add('groups-5');

  const coveredBuffIds = new Set();

  for (let gi = 0; gi < numGroups; gi++) {
    const players = State.groups[gi] || [];
    const buffList = getGroupBuffs(players, gi);
    buffList.forEach(b => coveredBuffIds.add(b.id));
    const roleLabel = getDominantRoleLabel(players);

    let slotsHTML = '';
    for (let si = 0; si < 5; si++) {
      if (si < players.length) {
        const p = players[si];
        const color = Config.ClassColors[p.class] || 'var(--text-primary)';
        const displayName = (p.name || 'Unknown').split('-')[0];
        const specClass = p.spec ? (p.spec + ' ' + (p.class ? p.class.charAt(0) + p.class.slice(1).toLowerCase() : '')) : '';
        slotsHTML += `<div class="player-slot" draggable="true" data-group="${gi}" data-slot="${si}">
          ${getRoleIcon(p.role)}
          <div class="player-info">
            <span class="player-name" style="color:${color}">${esc(displayName)}</span>
            <span class="player-spec">${esc(specClass)}</span>
          </div>
          ${getDragHandle()}
        </div>`;
      } else {
        slotsHTML += `<div class="player-slot empty-slot" data-group="${gi}" data-slot="${si}">
          <span class="role-icon" style="opacity:0.3;">&#8226;</span>
          <div class="player-info"><span class="player-name">Empty Slot</span></div>
        </div>`;
      }
    }

    let buffsHTML = '<span class="buff-bar-label">Buffs</span>';
    if (buffList.length === 0) {
      buffsHTML += '<span class="no-buffs">No buffs</span>';
    } else {
      for (const b of buffList) {
        const abbr = Config.BuffAbbreviations[b.id] || b.id;
        const css = Config.BuffCSSClass[b.id] || '';
        const from = b.sourceName ? b.sourceName.split('-')[0] : '';
        const sourceColor = b.sourceClass ? (Config.ClassColors[b.sourceClass] || 'var(--text-secondary)') : 'var(--text-secondary)';
        const iconUrl = Config.BuffIconURL(b.id);
        const hasIcon = iconUrl ? ' has-icon' : '';
        const imgTag = iconUrl ? `<img src="${iconUrl}" alt="${esc(abbr)}" loading="lazy" class="buff-img">` : '';
        const isSwappable = !!(TOTEM_ELEMENTS[b.id] || PALADIN_AURAS[b.id]);
        const swapClass = isSwappable ? ' swappable' : '';
        const overrideClass = b.isOverride ? ' overridden' : '';
        const dataAttrs = isSwappable ? ` data-buff-id="${esc(b.id)}" data-group="${gi}" data-uid="${esc(b.sourceUid)}" data-source="${esc(b.sourceName)}" data-class="${esc(b.sourceClass)}" data-spec="${esc(b.sourceSpec || '')}"` : '';
        const ttAttrs = ` data-tt-name="${esc(b.buff.name)}" data-tt-desc="${esc(b.buff.desc || '')}" data-tt-source="${esc(from)}" data-tt-source-color="${sourceColor}"`;
        buffsHTML += `<div class="buff-icon ${css}${hasIcon}${swapClass}${overrideClass}"${dataAttrs}${ttAttrs}>${imgTag}<span class="buff-label">${abbr}</span></div>`;
      }
    }

    container.innerHTML += `<div class="group-card" data-group="${gi}">
      <div class="group-header">
        <h3>Group ${gi+1}</h3>
        <div style="display:flex;align-items:center;gap:var(--sp-2);">
          <span class="group-role-tag">${roleLabel}</span>
        </div>
      </div>
      <div class="player-list">${slotsHTML}</div>
      <div class="buff-bar">${buffsHTML}</div>
    </div>`;
  }

  // Attach error handlers on buff images (CSP-safe, replaces inline onerror)
  container.querySelectorAll('.buff-img').forEach(img => {
    img.addEventListener('error', () => {
      img.parentElement.classList.remove('has-icon');
      img.remove();
    });
  });

  const coveredDebuffIds = getRaidDebuffCoverage(State.groups);
  renderBuffCatalog(coveredBuffIds, coveredDebuffIds);

  updateStatus();
  cleanupOverrides();
  renderManualChanges();

  // Update dropdown
  document.getElementById('raid-select').value = State.selectedRaid;
  document.getElementById('roster-name').textContent = State.rosterName;
}

// Debuffs aren't part of getGroupBuffs (they're applied to the enemy, not the
// raid) — a class/spec anywhere in an assigned group is enough to "cover" one.
function getRaidDebuffCoverage(groups) {
  const players = groups.flat();
  const covered = new Set();
  for (const id of Object.keys(Config.Debuffs)) {
    const d = Config.Debuffs[id];
    const has = players.some(p => p.class === d.sourceClass && (!d.sourceSpec || p.spec === d.sourceSpec));
    if (has) covered.add(id);
  }
  return covered;
}

function renderBuffCatalog(coveredBuffIds, coveredDebuffIds) {
  renderBuffRowList('buff-catalog-buffs', Config.Buffs, Config.BuffAbbreviations, id => Config.BuffIconURL(id), coveredBuffIds);
  renderBuffRowList('buff-catalog-debuffs', Config.Debuffs, Config.DebuffAbbreviations, id => Config.DebuffIconURL(id), coveredDebuffIds);
}

function renderBuffRowList(containerId, dataset, abbrMap, iconUrlFn, coveredIds) {
  const container = document.getElementById(containerId);
  if (!container) return;

  let html = '';
  for (const id of Object.keys(dataset)) {
    const entry = dataset[id];
    const iconUrl = iconUrlFn(id);
    const abbr = abbrMap[id] || id;
    const imgTag = iconUrl
      ? `<img src="${iconUrl}" alt="${esc(abbr)}" loading="lazy">`
      : esc(abbr);
    const sourceClassLabel = entry.sourceClass
      ? entry.sourceClass.charAt(0) + entry.sourceClass.slice(1).toLowerCase()
      : '';
    const sourceSpec = entry.sourceSpec || entry.preferSpec || '';
    const sourceLabel = sourceSpec ? `${sourceSpec} ${sourceClassLabel}` : sourceClassLabel;
    const sourceColor = entry.sourceClass ? (Config.ClassColors[entry.sourceClass] || 'var(--text-secondary)') : 'var(--text-secondary)';
    const isCovered = coveredIds.has(id);

    let tooltip = entry.desc || '';
    let warnBadge = '';
    if (entry.supersededBy) {
      const winner = dataset[entry.supersededBy];
      const winnerName = winner ? winner.name : entry.supersededBy;
      tooltip += ` Shares a debuff slot with ${winnerName}, which is strictly better.`;
      warnBadge = ` <span class="buff-row-warn" title="Superseded by ${esc(winnerName)}">&#9888;</span>`;
    } else if (entry.competesWith && entry.competesWith.length) {
      const names = entry.competesWith.map(cid => (dataset[cid] ? dataset[cid].name : cid)).join(', ');
      tooltip += ` Mutually exclusive with: ${names}.`;
    }

    html += `<div class="buff-row${isCovered ? ' covered' : ''}" title="${esc(tooltip)}">
      <div class="buff-row-icon">${imgTag}</div>
      <span class="buff-row-name">${esc(entry.name)}</span>${warnBadge}
      <span class="buff-row-source" style="color:${sourceColor}">${esc(sourceLabel)}</span>
    </div>`;
  }
  container.innerHTML = html;
}

function updateStatus() {
  const total = State.roster.length;
  const raidInfo = Config.Raids[State.selectedRaid];
  const max = raidInfo ? raidInfo.size : 25;
  document.getElementById('status-text').textContent = total > 0
    ? `${total}/${max} players loaded`
    : 'Ready — import a roster to begin';
}

// ── DRAG & DROP (event delegation — attached once) ──────────────
let dragData = null;

(function initDragDrop() {
  const container = document.getElementById('groups-container');
  const ghost = document.getElementById('drag-ghost');

  container.addEventListener('dragstart', e => {
    const slot = e.target.closest('.player-slot[draggable="true"]');
    if (!slot) return;
    const gi = parseInt(slot.dataset.group);
    const si = parseInt(slot.dataset.slot);
    dragData = { group: gi, slot: si };
    slot.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    const img = new Image(); img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAUEBAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    e.dataTransfer.setDragImage(img, 0, 0);
    const p = State.groups[gi][si];
    if (p) {
      ghost.textContent = p.name.split('-')[0];
      ghost.style.color = Config.ClassColors[p.class] || 'var(--text-primary)';
      ghost.style.display = 'block';
    }
  });

  container.addEventListener('drag', e => {
    if (e.clientX > 0) {
      ghost.style.left = (e.clientX + 12) + 'px';
      ghost.style.top = (e.clientY - 10) + 'px';
    }
  });

  container.addEventListener('dragend', e => {
    const slot = e.target.closest('.player-slot');
    if (slot) slot.classList.remove('dragging');
    ghost.style.display = 'none';
    dragData = null;
    container.querySelectorAll('.drag-target').forEach(s => s.classList.remove('drag-target'));
    container.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
  });

  container.addEventListener('dragover', e => {
    const slot = e.target.closest('.player-slot');
    if (!slot) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    slot.classList.add('drag-target');
    const card = slot.closest('.group-card');
    if (card) card.classList.add('drag-over');
  });

  container.addEventListener('dragleave', e => {
    const slot = e.target.closest('.player-slot');
    if (!slot) return;
    slot.classList.remove('drag-target');
    const card = slot.closest('.group-card');
    if (card && !card.querySelector('.drag-target')) card.classList.remove('drag-over');
  });

  container.addEventListener('drop', e => {
    const slot = e.target.closest('.player-slot');
    if (!slot || !dragData) return;
    e.preventDefault();

    const srcG = dragData.group, srcS = dragData.slot;
    const tgtG = parseInt(slot.dataset.group), tgtS = parseInt(slot.dataset.slot);

    if (srcG === tgtG && srcS === tgtS) return;

    const srcPlayer = State.groups[srcG][srcS] || null;
    const tgtPlayer = State.groups[tgtG][tgtS] || null;

    if (srcPlayer && !tgtPlayer) {
      State.groups[srcG].splice(srcS, 1);
      if (tgtS >= State.groups[tgtG].length) State.groups[tgtG].push(srcPlayer);
      else State.groups[tgtG].splice(tgtS, 0, srcPlayer);
      srcPlayer.groupNumber = tgtG + 1;
    } else if (srcPlayer && tgtPlayer) {
      State.groups[srcG][srcS] = tgtPlayer;
      State.groups[tgtG][tgtS] = srcPlayer;
      srcPlayer.groupNumber = tgtG + 1;
      tgtPlayer.groupNumber = srcG + 1;
    }

    // renderGroups() below rebuilds groups-container, which destroys the
    // dragged element before the browser can dispatch 'dragend' on it — so
    // it never bubbles up to the container's dragend listener and the ghost
    // is left stuck on screen. Clean up here instead of relying on that.
    ghost.style.display = 'none';
    dragData = null;

    renderGroups();
  });

  // ── Touch drag-and-drop support ──
  let touchDrag = null;

  container.addEventListener('touchstart', e => {
    const slot = e.target.closest('.player-slot[draggable="true"]');
    if (!slot) return;
    const gi = parseInt(slot.dataset.group);
    const si = parseInt(slot.dataset.slot);
    const p = State.groups[gi]?.[si];
    if (!p) return;
    touchDrag = { group: gi, slot: si, el: slot };
    slot.classList.add('dragging');
    ghost.textContent = p.name.split('-')[0];
    ghost.style.color = Config.ClassColors[p.class] || 'var(--text-primary)';
    ghost.style.display = 'block';
  }, { passive: true });

  container.addEventListener('touchmove', e => {
    if (!touchDrag) return;
    e.preventDefault();
    const touch = e.touches[0];
    ghost.style.left = (touch.clientX + 12) + 'px';
    ghost.style.top = (touch.clientY - 10) + 'px';
    // Highlight target
    container.querySelectorAll('.drag-target').forEach(s => s.classList.remove('drag-target'));
    container.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if (el) {
      const target = el.closest('.player-slot');
      if (target) {
        target.classList.add('drag-target');
        const card = target.closest('.group-card');
        if (card) card.classList.add('drag-over');
      }
    }
  }, { passive: false });

  container.addEventListener('touchend', e => {
    if (!touchDrag) return;
    ghost.style.display = 'none';
    touchDrag.el.classList.remove('dragging');
    container.querySelectorAll('.drag-target').forEach(s => s.classList.remove('drag-target'));
    container.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));

    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const target = el ? el.closest('.player-slot') : null;

    if (target) {
      const srcG = touchDrag.group, srcS = touchDrag.slot;
      const tgtG = parseInt(target.dataset.group), tgtS = parseInt(target.dataset.slot);

      if (!(srcG === tgtG && srcS === tgtS)) {
        const srcPlayer = State.groups[srcG][srcS] || null;
        const tgtPlayer = State.groups[tgtG]?.[tgtS] || null;

        if (srcPlayer && !tgtPlayer) {
          State.groups[srcG].splice(srcS, 1);
          if (tgtS >= State.groups[tgtG].length) State.groups[tgtG].push(srcPlayer);
          else State.groups[tgtG].splice(tgtS, 0, srcPlayer);
          srcPlayer.groupNumber = tgtG + 1;
        } else if (srcPlayer && tgtPlayer) {
          State.groups[srcG][srcS] = tgtPlayer;
          State.groups[tgtG][tgtS] = srcPlayer;
          srcPlayer.groupNumber = tgtG + 1;
          tgtPlayer.groupNumber = srcG + 1;
        }
        renderGroups();
      }
    }
    touchDrag = null;
  });
})();

// ── BUFF OVERRIDE SYSTEM ────────────────────────────────────────
function cleanupOverrides() {
  for (const key of Object.keys(State.buffOverrides)) {
    const parts = key.split(':');
    const gi = parseInt(parts[0]);
    const uid = parts[1];
    const group = State.groups[gi] || [];
    if (!group.find(p => p.uid === uid)) {
      delete State.buffOverrides[key];
    }
  }
}

function getSwappableBuffs(buffId, playerClass, playerSpec) {
  const element = TOTEM_ELEMENTS[buffId];
  const isAura = PALADIN_AURAS[buffId];
  if (!element && !isAura) return [];

  const alternatives = [];
  if (element) {
    for (const [id, el] of Object.entries(TOTEM_ELEMENTS)) {
      if (el !== element) continue;
      const buff = Config.Buffs[id];
      if (!buff) continue;
      if (buff.sourceClass !== playerClass) continue;
      if (buff.sourceSpec && buff.sourceSpec !== playerSpec) continue;
      alternatives.push({ id, buff });
    }
  } else if (isAura) {
    for (const id of Object.keys(PALADIN_AURAS)) {
      const buff = Config.Buffs[id];
      if (!buff) continue;
      alternatives.push({ id, buff });
    }
  }
  return alternatives;
}

function showBuffPicker(buffIcon, buffId, groupIndex, sourceUid, sourceName, sourceClass, sourceSpec) {
  // Close any existing picker
  closeBuffPicker();

  const alts = getSwappableBuffs(buffId, sourceClass, sourceSpec);
  if (alts.length <= 1) return; // Nothing to swap to

  const element = TOTEM_ELEMENTS[buffId];
  const category = element || 'aura';
  const overrideKey = `${groupIndex}:${sourceUid}:${category}`;

  // Build picker HTML
  let pickerHTML = `<div class="buff-picker-title">Choose ${element ? element + ' totem' : 'aura'}</div>`;
  for (const alt of alts) {
    const isActive = alt.id === buffId;
    const iconUrl = Config.BuffIconURL(alt.id);
    const imgTag = iconUrl ? `<img src="${iconUrl}" alt="${alt.buff.name}">` : '';
    pickerHTML += `<div class="buff-picker-item${isActive ? ' active' : ''}" data-pick-id="${alt.id}">
      ${imgTag}<span class="picker-buff-name">${esc(alt.buff.name)}</span>${isActive ? '<span class="picker-check">&#10003;</span>' : ''}
    </div>`;
  }
  // Reset option if overridden
  if (State.buffOverrides[overrideKey]) {
    pickerHTML += `<div class="buff-picker-reset" data-pick-reset="true">Reset to default</div>`;
  }

  // Create overlay to catch outside clicks
  const overlay = document.createElement('div');
  overlay.className = 'buff-picker-overlay';
  overlay.addEventListener('click', closeBuffPicker);
  document.body.appendChild(overlay);

  // Create picker element positioned above the buff icon
  const picker = document.createElement('div');
  picker.className = 'buff-picker';
  picker.id = 'active-buff-picker';
  picker.innerHTML = pickerHTML;
  document.body.appendChild(picker);

  // Position above the icon
  const rect = buffIcon.getBoundingClientRect();
  picker.style.left = (rect.left + rect.width / 2 - picker.offsetWidth / 2) + 'px';
  picker.style.top = (rect.top - picker.offsetHeight - 6 + window.scrollY) + 'px';

  // Handle picks
  picker.querySelectorAll('.buff-picker-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const pickId = item.dataset.pickId;
      if (pickId === buffId && !State.buffOverrides[overrideKey]) {
        closeBuffPicker();
        return; // Already the default, no change
      }
      // Preserve the original default buff (before any overrides)
      const existingOriginal = State.buffOverrides[overrideKey]?.originalBuffId || buffId;
      if (pickId === existingOriginal) {
        // Picking the default — just remove the override
        delete State.buffOverrides[overrideKey];
      } else {
        State.buffOverrides[overrideKey] = { buffId: pickId, originalBuffId: existingOriginal };
      }
      closeBuffPicker();
      renderGroups();
    });
  });

  const resetBtn = picker.querySelector('.buff-picker-reset');
  if (resetBtn) {
    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      delete State.buffOverrides[overrideKey];
      closeBuffPicker();
      renderGroups();
    });
  }
}

function closeBuffPicker() {
  const existing = document.getElementById('active-buff-picker');
  if (existing) existing.remove();
  const overlay = document.querySelector('.buff-picker-overlay');
  if (overlay) overlay.remove();
}

// Buff picker delegation — attached once
(function initBuffPickers() {
  document.getElementById('groups-container').addEventListener('click', e => {
    const icon = e.target.closest('.buff-icon.swappable');
    if (!icon) return;
    e.stopPropagation();
    const buffId = icon.dataset.buffId;
    const gi = parseInt(icon.dataset.group);
    const sourceUid = icon.dataset.uid;
    const sourceName = icon.dataset.source;
    const sourceClass = icon.dataset.class;
    const sourceSpec = icon.dataset.spec;
    showBuffPicker(icon, buffId, gi, sourceUid, sourceName, sourceClass, sourceSpec);
  });
})();

function renderManualChanges() {
  const container = document.getElementById('manual-changes');
  const entries = Object.entries(State.buffOverrides);

  if (entries.length === 0) {
    container.style.display = 'none';
    return;
  }

  container.style.display = 'block';
  let html = '<h3>&#9888; Manual Changes Required</h3><ul>';

  for (const [key, override] of entries) {
    const parts = key.split(':');
    const gi = parseInt(parts[0]);
    const uid = parts[1];
    const toBuff = Config.Buffs[override.buffId];
    const fromBuff = Config.Buffs[override.originalBuffId];
    if (!toBuff || !fromBuff) continue;

    // Find player by uid for name and class color
    const group = State.groups[gi] || [];
    const player = group.find(p => p.uid === uid);
    const displayName = player ? player.name.split('-')[0] : 'Unknown';
    const color = player ? (Config.ClassColors[player.class] || 'var(--text-primary)') : 'var(--text-primary)';

    html += `<li>
      <span style="color:${color};font-weight:600;">${esc(displayName)}</span>
      <span>(Group ${gi + 1})</span>
      <span class="change-arrow">&#8594;</span>
      <span>Use <span class="change-buff">${esc(toBuff.name)}</span> instead of <span class="change-buff">${esc(fromBuff.name)}</span></span>
      <span class="change-remove" data-override-key="${esc(key)}" title="Remove override">&times;</span>
    </li>`;
  }
  html += '</ul>';
  container.innerHTML = html;

  // Wire up remove buttons
  container.querySelectorAll('.change-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      delete State.buffOverrides[btn.dataset.overrideKey];
      renderGroups();
    });
  });
}

// ── LOCAL STORAGE ───────────────────────────────────────────────
function getSavedRosters() {
  try { return JSON.parse(localStorage.getItem('pp_rosters') || '{}'); }
  catch { return {}; }
}
function saveRosterToStorage(name, data) {
  const rosters = getSavedRosters();
  rosters[name] = data;
  localStorage.setItem('pp_rosters', JSON.stringify(rosters));
}
function deleteRosterFromStorage(name) {
  const rosters = getSavedRosters();
  delete rosters[name];
  localStorage.setItem('pp_rosters', JSON.stringify(rosters));
}

// ── MODAL: SAVE ─────────────────────────────────────────────────
function showSaveModal() {
  const modal = document.getElementById('save-modal');
  const overlay = document.getElementById('save-overlay');

  const defaultName = State.rosterName !== 'No Roster Loaded' ? State.rosterName :
    'Raid ' + new Date().toLocaleDateString();

  modal.innerHTML = `
    <h3>Save Roster</h3>
    <input class="save-input" id="save-name-input" type="text" value="${esc(defaultName)}" placeholder="Roster name...">
    <div class="import-buttons">
      <button class="btn btn-secondary" id="btn-cancel-save">Cancel</button>
      <button class="btn btn-primary" id="btn-do-save">Save</button>
    </div>`;

  overlay.classList.add('visible');

  document.getElementById('btn-cancel-save').onclick = () => overlay.classList.remove('visible');
  document.getElementById('btn-do-save').onclick = () => {
    const name = document.getElementById('save-name-input').value.trim();
    if (!name) return;
    const data = Import.exportRoster(name);
    saveRosterToStorage(name, data);
    State.rosterName = name;
    overlay.classList.remove('visible');
    showToast(`Roster "${name}" saved`);
    renderGroups();
  };
  overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('visible'); };

  document.getElementById('save-name-input').focus();
  document.getElementById('save-name-input').select();
}

// ── MODAL: LOAD ─────────────────────────────────────────────────
function showLoadModal() {
  const modal = document.getElementById('save-modal');
  const overlay = document.getElementById('save-overlay');
  const rosters = getSavedRosters();
  const names = Object.keys(rosters);

  let listHTML = '';
  if (names.length === 0) {
    listHTML = '<p style="font-size:11px;color:var(--text-muted);text-align:center;padding:16px;">No saved rosters yet</p>';
  } else {
    for (const name of names) {
      const r = rosters[name];
      const count = r.players ? r.players.length : 0;
      const raid = r.raid ? (Config.Raids[r.raid]?.name || r.raid) : '';
      listHTML += `<div class="saved-roster-item" data-name="${esc(name)}">
        <div><span class="roster-item-name">${esc(name)}</span><br><span class="roster-item-meta">${count} players — ${esc(raid)}</span></div>
        <button class="roster-item-delete" data-delete="${esc(name)}" title="Delete">&times;</button>
      </div>`;
    }
  }

  modal.innerHTML = `
    <h3>Load Roster</h3>
    <div class="saved-roster-list">${listHTML}</div>
    <div class="import-buttons">
      <button class="btn btn-secondary" id="btn-cancel-load">Close</button>
    </div>`;

  overlay.classList.add('visible');

  document.getElementById('btn-cancel-load').onclick = () => overlay.classList.remove('visible');
  overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('visible'); };

  modal.querySelectorAll('.saved-roster-item').forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.dataset.delete) return;
      const name = item.dataset.name;
      const data = rosters[name];
      if (Import.loadRoster(data)) {
        overlay.classList.remove('visible');
        initGroups();
        renderGroups();
        showToast(`Loaded "${name}"`);
      }
    });
  });

  modal.querySelectorAll('.roster-item-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const name = btn.dataset.delete;
      deleteRosterFromStorage(name);
      showLoadModal(); // re-render
      showToast(`Deleted "${name}"`);
    });
  });
}

// ── IMPORT MODAL ────────────────────────────────────────────────
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-overlay').classList.add('visible');
  document.getElementById('import-textarea').value = '';
  document.getElementById('import-textarea').focus();
});
document.getElementById('btn-cancel-import').addEventListener('click', () => {
  document.getElementById('import-overlay').classList.remove('visible');
});
document.getElementById('import-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('visible');
});
document.getElementById('btn-do-import').addEventListener('click', async () => {
  const text = document.getElementById('import-textarea').value.trim();
  if (!text) return;

  // Detect addon string input (starts with PP:)
  if (text.startsWith('PP:')) {
    const result = Import.importAddonString(text);
    if (result.success) {
      State.rosterName = 'Imported Roster';
      document.getElementById('import-overlay').classList.remove('visible');
      document.getElementById('raid-select').value = State.selectedRaid;
      initGroups();
      renderGroups();
      showToast(`Imported ${result.playerCount} players from addon string`);
    } else {
      showToast('Import failed: ' + result.error);
    }
    return;
  }

  let jsonStr = text;

  // Detect URL input — fetch the JSON first
  if (text.startsWith('http://') || text.startsWith('https://')) {
    let url = text;
    // Normalize: if they paste the website URL, convert to API URL
    // e.g. https://raid-helper.dev/event/1234 → https://raid-helper.dev/api/raidplan/1234
    const eventMatch = url.match(/raid-helper\.dev\/event\/(\d+)/);
    if (eventMatch) url = `https://raid-helper.dev/api/raidplan/${eventMatch[1]}`;

    showToast('Fetching roster from URL...');
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    try {
      const resp = await fetch(url, { signal: controller.signal, mode: 'cors', credentials: 'omit' });
      clearTimeout(timeoutId);
      if (!resp.ok) { showToast(`Fetch failed: HTTP ${resp.status}`); return; }
      jsonStr = await resp.text();
    } catch (err) {
      clearTimeout(timeoutId);
      if (err.name === 'AbortError') {
        showToast('Request timed out — try again or paste the JSON directly');
      } else if (err instanceof TypeError) {
        showToast('Network error — the server may not allow direct browser requests. Try pasting the JSON instead.');
      } else {
        showToast('Fetch failed: ' + err.message);
      }
      return;
    }
  }

  const result = Import.importRaidHelper(jsonStr);
  if (result.success) {
    State.rosterName = 'Imported Roster';
    document.getElementById('import-overlay').classList.remove('visible');
    document.getElementById('raid-select').value = State.selectedRaid;
    initGroups();
    renderGroups();
    showToast(result.wasUnassigned
      ? `Imported ${result.playerCount} sign-ups and auto-optimized into ${result.groupCount} groups`
      : `Imported ${result.playerCount} players into ${result.groupCount} groups`);
  } else {
    showToast('Import failed: ' + result.error);
  }
});

// ── IDEAL COMP MODULE ────────────────────────────────────────────
const IdealComp = {
  // 25-man: 2 tanks, 5 healers, 18 DPS — optimized for buff synergies
  // 10-man: 2 tanks, 2 healers, 6 DPS
  generate(raidKey) {
    const raidInfo = Config.Raids[raidKey];
    if (!raidInfo) return [];
    return raidInfo.size === 10 ? this.build10Man() : this.build25Man();
  },

  makePlayer(cls, spec, role) {
    const specData = Object.values(Config.Specs[cls] || {}).find(s => s.name === spec);
    return {
      uid: nextUid(),
      name: spec + ' ' + cls.charAt(0) + cls.slice(1).toLowerCase(),
      class: cls,
      spec: spec,
      role: role || (specData ? specData.role : 'melee_dps'),
      imported: false,
    };
  },

  build25Man() {
    // Reference: classic TBC ideal 25-man comp
    // 1T + 5H + 19DPS (Ferals flex tank as needed)
    const groups = [
      // Group 1: Melee — LotP + WF + physical DPS
      [
        this.makePlayer('DRUID', 'Feral', 'melee_dps'),        // LotP, flex tank
        this.makePlayer('SHAMAN', 'Enhancement', 'melee_dps'), // WF + SoE
        this.makePlayer('PALADIN', 'Retribution', 'melee_dps'),
        this.makePlayer('WARRIOR', 'Arms', 'melee_dps'),
        this.makePlayer('HUNTER', 'Beast Mastery', 'ranged_dps'), // FI + TSA
      ],
      // Group 2: Melee — LotP + WF + physical DPS
      [
        this.makePlayer('DRUID', 'Feral', 'melee_dps'),        // LotP, flex tank
        this.makePlayer('SHAMAN', 'Enhancement', 'melee_dps'), // WF + SoE
        this.makePlayer('ROGUE', 'Combat', 'melee_dps'),
        this.makePlayer('WARRIOR', 'Fury', 'melee_dps'),
        this.makePlayer('HUNTER', 'Survival', 'ranged_dps'),
      ],
      // Group 3: Casters — Mana Tide + Shadow Weaving + healer support
      [
        this.makePlayer('MAGE', 'Arcane', 'caster_dps'),
        this.makePlayer('MAGE', 'Arcane', 'caster_dps'),
        this.makePlayer('SHAMAN', 'Restoration', 'healer'),    // Mana Tide + WoA
        this.makePlayer('PRIEST', 'Shadow', 'caster_dps'),     // Shadow Weaving
        this.makePlayer('PRIEST', 'Holy', 'healer'),
      ],
      // Group 4: Casters — ToW + Moonkin Aura + Warlock stack
      [
        this.makePlayer('WARLOCK', 'Destruction', 'caster_dps'),
        this.makePlayer('WARLOCK', 'Destruction', 'caster_dps'),
        this.makePlayer('WARLOCK', 'Destruction', 'caster_dps'),
        this.makePlayer('SHAMAN', 'Elemental', 'caster_dps'),  // WoA + ToW
        this.makePlayer('DRUID', 'Balance', 'caster_dps'),     // Moonkin Aura
      ],
      // Group 5: Healers + Tank
      [
        this.makePlayer('PALADIN', 'Holy', 'healer'),
        this.makePlayer('SHAMAN', 'Restoration', 'healer'),    // Mana Tide
        this.makePlayer('DRUID', 'Restoration', 'healer'),
        this.makePlayer('PALADIN', 'Protection', 'tank'),
        this.makePlayer('WARLOCK', 'Affliction', 'caster_dps'),
      ],
    ];

    for (let gi = 0; gi < groups.length; gi++) {
      for (const p of groups[gi]) p.groupNumber = gi + 1;
    }
    return groups;
  },

  build10Man() {
    // 2 tanks, 2 healers, 6 DPS
    const groups = [
      // Group 1: Tanks + Melee + Shaman
      [
        this.makePlayer('WARRIOR', 'Protection', 'tank'),
        this.makePlayer('DRUID', 'Feral', 'tank'),           // LotP
        this.makePlayer('SHAMAN', 'Enhancement', 'melee_dps'), // WF + SoE
        this.makePlayer('ROGUE', 'Combat', 'melee_dps'),
        this.makePlayer('PALADIN', 'Holy', 'healer'),        // Devotion Aura
      ],
      // Group 2: Casters + Healer
      [
        this.makePlayer('SHAMAN', 'Elemental', 'caster_dps'),  // WoA + ToW
        this.makePlayer('WARLOCK', 'Affliction', 'caster_dps'),
        this.makePlayer('MAGE', 'Arcane', 'caster_dps'),
        this.makePlayer('HUNTER', 'Beast Mastery', 'ranged_dps'), // FI
        this.makePlayer('PRIEST', 'Holy', 'healer'),
      ],
    ];
    for (let gi = 0; gi < groups.length; gi++) {
      for (const p of groups[gi]) p.groupNumber = gi + 1;
    }
    return groups;
  },
};

// ── TAB SWITCHING ───────────────────────────────────────────────
function switchTab(tab) {
  State.activeTab = tab;

  // Update tab button styles
  document.querySelectorAll('.mode-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  // Show/hide plan-mode-only elements
  const planOnly = ['roster-bar', 'manual-changes', 'action-bar'].map(
    cls => document.querySelector('.' + cls)
  ).filter(Boolean);
  for (const el of planOnly) {
    el.style.display = tab === 'plan' ? '' : 'none';
  }

  if (tab === 'ideal') {
    renderIdealComp();
  } else {
    renderGroups();
  }
}

function renderIdealComp() {
  const container = document.getElementById('groups-container');
  container.innerHTML = '';

  const raidInfo = Config.Raids[State.selectedRaid];
  const groups = IdealComp.generate(State.selectedRaid);
  const numGroups = groups.length;

  container.className = 'groups-container';
  if (numGroups === 5) container.classList.add('groups-5');

  const coveredBuffIds = new Set();

  for (let gi = 0; gi < numGroups; gi++) {
    const players = groups[gi] || [];
    const buffList = getGroupBuffs(players, gi);
    buffList.forEach(b => coveredBuffIds.add(b.id));
    const roleLabel = getDominantRoleLabel(players);

    let slotsHTML = '';
    for (let si = 0; si < 5; si++) {
      if (si < players.length) {
        const p = players[si];
        const color = Config.ClassColors[p.class] || 'var(--text-primary)';
        const specLabel = p.spec + ' ' + p.class.charAt(0) + p.class.slice(1).toLowerCase();
        slotsHTML += `<div class="player-slot" data-group="${gi}" data-slot="${si}">
          ${getRoleIcon(p.role)}
          <div class="player-info">
            <span class="player-name" style="color:${color}">${esc(specLabel)}</span>
          </div>
        </div>`;
      } else {
        slotsHTML += `<div class="player-slot empty-slot" data-group="${gi}" data-slot="${si}">
          <span class="role-icon" style="opacity:0.3;">&#8226;</span>
          <div class="player-info"><span class="player-name">Empty Slot</span></div>
        </div>`;
      }
    }

    let buffsHTML = '<span class="buff-bar-label">Buffs</span>';
    if (buffList.length === 0) {
      buffsHTML += '<span class="no-buffs">No buffs</span>';
    } else {
      for (const b of buffList) {
        const abbr = Config.BuffAbbreviations[b.id] || b.id;
        const css = Config.BuffCSSClass[b.id] || '';
        const iconUrl = Config.BuffIconURL(b.id);
        const hasIcon = iconUrl ? ' has-icon' : '';
        const imgTag = iconUrl ? `<img src="${iconUrl}" alt="${esc(abbr)}" loading="lazy" class="buff-img">` : '';
        const ttAttrs = ` data-tt-name="${esc(b.buff.name)}" data-tt-desc="${esc(b.buff.desc || '')}"`;
        buffsHTML += `<div class="buff-icon ${css}${hasIcon}"${ttAttrs}>${imgTag}<span class="buff-label">${abbr}</span></div>`;
      }
    }

    container.innerHTML += `<div class="group-card" data-group="${gi}">
      <div class="group-header">
        <h3>Group ${gi+1}</h3>
        <div style="display:flex;align-items:center;gap:var(--sp-2);">
          <span class="group-role-tag">${roleLabel}</span>
        </div>
      </div>
      <div class="player-list">${slotsHTML}</div>
      <div class="buff-bar">${buffsHTML}</div>
    </div>`;
  }

  // Attach error handlers on buff images
  container.querySelectorAll('.buff-img').forEach(img => {
    img.addEventListener('error', () => {
      img.parentElement.classList.remove('has-icon');
      img.remove();
    });
  });

  const coveredDebuffIds = getRaidDebuffCoverage(groups);
  renderBuffCatalog(coveredBuffIds, coveredDebuffIds);

  document.getElementById('status-text').textContent = `Ideal ${raidInfo.size}-man comp — ${raidInfo.name}`;
}

// ── BUFF TOOLTIP PORTAL ─────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  const portal = document.getElementById('buff-tooltip-portal');
  if (!portal) return;

  document.addEventListener('mouseover', function(e) {
    const icon = e.target.closest('.buff-icon[data-tt-name]');
    if (!icon) return;

    const name = icon.getAttribute('data-tt-name');
    const desc = icon.getAttribute('data-tt-desc');
    const source = icon.getAttribute('data-tt-source');
    const sourceColor = icon.getAttribute('data-tt-source-color');

    let html = `<div class="tt-name">${name}</div>`;
    if (desc) html += `<div class="tt-desc">${desc}</div>`;
    if (source) html += `<div class="tt-source"><span style="color:${sourceColor}">${source}</span></div>`;

    portal.innerHTML = html;
    portal.style.display = 'block';

    const rect = icon.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - 110;
    let top = rect.top - portal.offsetHeight - 8;

    // Keep within viewport
    if (left < 4) left = 4;
    if (left + 220 > window.innerWidth) left = window.innerWidth - 224;
    if (top < 4) { top = rect.bottom + 8; }

    portal.style.left = left + 'px';
    portal.style.top = top + 'px';
  });

  document.addEventListener('mouseout', function(e) {
    const icon = e.target.closest('.buff-icon[data-tt-name]');
    if (!icon) return;
    const related = e.relatedTarget;
    if (related && icon.contains(related)) return;
    portal.style.display = 'none';
  });
});
